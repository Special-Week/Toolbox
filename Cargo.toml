[package]
name = "toolbox"
version = "2026.11.20"
edition = "2024"
license = "MIT"

[features]
default = ["desktop-ui"]
desktop-ui = [
    "dep:egui-notify",
    "dep:egui-phosphor",
    "dep:egui_extras",
    "dep:egui_plot",
    "dep:image",
    "dep:ratex-layout",
    "dep:ratex-parser",
    "dep:ratex-render",
    "dep:ratex-types",
]

[[bin]]
name = "Toolbox_rust"
path = "src/main.rs"
required-features = ["desktop-ui"]

[dependencies]
toolbox-core = { path = "crates/toolbox-core" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.31.1", optional = true }
egui-phosphor = { version = "0.9.0", optional = true }
egui-notify = { version = "0.19.0", optional = true }
egui_plot = { version = "0.32.1", optional = true }
image = { version = "0.25.10", default-features = false, optional = true }
rfd = { version = "0.17.2", default-features = false }
tempfile = "3.23"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
ureq = { version = "=3.2.0", features = ["cookies"] }
url = "2.5"
regex = "1.12"
html-escape = "0.2"
sha2 = "0.11"
lopdf = { version = "0.46", default-features = false }
ratex-layout = { version = "=0.1.15", optional = true }
ratex-parser = { version = "=0.1.15", optional = true }
ratex-render = { version = "=0.1.15", features = ["embed-fonts"], optional = true }
ratex-types = { version = "=0.1.15", optional = true }

[build-dependencies]
winresource = "0.1"

