[package]
name = "toolbox"
version = "0.3.0"
edition = "2024"
license = "MIT"

[features]
default = ["desktop-ui"]
desktop-ui = []

[[bin]]
name = "Toolbox"
path = "src/main.rs"
required-features = ["desktop-ui"]

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.17.2", default-features = false }
tempfile = "3.23"
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[build-dependencies]
winresource = "0.1"

