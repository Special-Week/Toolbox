[package]
name = "toolbox-web-core"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# 与桌面入口共用模型文件；网页构建不启用桌面页面模块。
[features]
desktop-ui = []

[dependencies]
wasm-bindgen = "=0.2.114"
serde = { version = "1", features = ["derive"] }
# JSON 数值须精确还原 f64，避免端点正反算被解析误差误判为越界。
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
